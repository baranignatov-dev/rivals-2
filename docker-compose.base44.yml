services:
  web:
    image: node:22
    working_dir: /app
    init: true
    # Source is bind-mounted and the Vite dev server serves it live, so edits
    # appear without rebuilding an image. Dependencies are synced from the
    # mounted package.json on every boot.
    command:
      [
        'sh',
        '-ec',
        'npm install --no-audit --no-fund && exec npm run dev -- --host 0.0.0.0 --port 3000',
      ]
    ports:
      - '3000:3000'
    volumes:
      - .:/app
    environment:
      - BASE44_PREVIEW_MODE
      - BASE44_PUBLIC_HOST_SUFFIX
      - BASE44_SANDBOX_HOST_DOMAIN
    restart: on-failure
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'node -e "fetch(\"http://127.0.0.1:3000/\").then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"',
        ]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 120s
    labels:
      base44.project: Forge Game Studio
      base44.kind: web
      base44.port: '3000'
