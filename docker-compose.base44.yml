services:
  web:
    image: node:22
    working_dir: /app
    # Installs from the committed lockfile whenever the container starts, then
    # runs Vite's dev server so edits in the repo hot-reload in the preview.
    command:
      - sh
      - -ec
      - npm ci --no-audit --no-fund && exec npm run dev
    ports:
      - "3000:3000"
    volumes:
      - ./:/app
      - web_node_modules:/app/node_modules
    environment:
      - BASE44_PREVIEW_MODE
      - BASE44_SANDBOX_HOST_DOMAIN
      - BASE44_PUBLIC_HOST_SUFFIX
      - __VITE_ADDITIONAL_SERVER_ALLOWED_HOSTS
      - CHOKIDAR_USEPOLLING=1
    healthcheck:
      test:
        - CMD-SHELL
        - node -e "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 15s
      timeout: 5s
      start_period: 90s
      retries: 5
    restart: on-failure
    labels:
      base44.project: Rivals 2 Arena
      base44.kind: web
      base44.port: "3000"

volumes:
  web_node_modules:
